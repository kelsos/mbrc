// Types the Compose compiler should treat as stable.
//
// Read by every module applying the Compose plugin, wired up in the root build.gradle.kts.
//
// kotlin.collections.List is unstable to the compiler because the interface permits a mutable
// implementation, so any composable taking one can never skip. That covers the scaffold's
// menuItems and actionItems, which every screen in the app passes, along with the sort options,
// the changelog and the lyrics.
//
// Listing it here is a promise that a list handed to a composable is never mutated in place. The
// app builds these with listOf(...) at the call site, so the promise holds; if that ever stops
// being true, the symptom is a composable that does not update when its list changes, and the fix
// is an immutable collection type at that call site rather than the removal of this line.
kotlin.collections.List

// Value types that are immutable by construction but live in core:common, which is not compiled
// with the Compose plugin, so stability cannot be inferred across the module boundary. Listed
// individually rather than by package: the promise is only checked by reading the class, and a
// wildcard would silently adopt whatever gets added to those packages later.
//
// TrackAction is a sealed class of data objects over a val, ConnectionSettings a data class whose
// every property is a val of a primitive or String.
com.kelsos.mbrc.core.common.settings.TrackAction
com.kelsos.mbrc.core.common.data.ConnectionSettings

// Same story from core:data, and this one is a list row, so it is on a scrolling path. Every
// property is a val of a primitive or String; isFolder and isPlaylist derive from itemType.
com.kelsos.mbrc.core.data.playlist.PlaylistBrowserItem
